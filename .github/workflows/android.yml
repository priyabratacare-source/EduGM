
name: EduGM UniTools Android APK

on:
  push:
    branches:
      - main
    paths:
      - 'www/**'
      - 'package.json'
      - 'capacitor.config.json'
      - '.github/workflows/android.yml'

  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android:
    name: Build EduGM Android APK
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Install Dependencies
        run: npm install --no-audit --no-fund

      - name: Check JavaScript Syntax
        run: |
          for file in www/js/*.js; do
            echo "Checking $file"
            node --check "$file"
          done

      - name: Verify Capacitor Configuration
        run: |
          test -f capacitor.config.json
          test -d www
          test -f www/index.html
          test ! -f capacitor.config.ts

      - name: Create Android Project
        run: |
          if [ ! -d android ]; then
            npx cap add android
          fi

      - name: Synchronize Application
        run: npx cap sync android

      - name: Build Debug APK
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v6
        with:
          name: EduGM-UniTools-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
