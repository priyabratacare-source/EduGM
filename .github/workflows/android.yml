
name: EduGM UniTools Android APK

on:
  push:
    branches:
      - main
    paths:
      - 'www/**'
      - 'package.json'
      - 'capacitor.config.json'
      - 'google-services.json'
      - '.github/workflows/android.yml'

  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android:
    name: Build EduGM Android APK
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Install Dependencies
        run: npm install --no-audit --no-fund

      - name: Check JavaScript Syntax
        run: |
          for file in www/js/*.js; do
            echo "Checking $file"
            node --check "$file"
          done

      - name: Verify Capacitor Configuration
        run: |
          test -f capacitor.config.json
          test -d www
          test -f www/index.html
          test ! -f capacitor.config.ts

      - name: Create Android Project
        run: |
          if [ ! -d android ]; then
            npx cap add android
          fi

      - name: Configure Firebase Android
        run: |
          test -f google-services.json
          mkdir -p android/app
          cp google-services.json android/app/google-services.json
          python3 - <<'PY'
          from pathlib import Path
          root = Path("android")
          root_gradle = next((p for p in [root/"build.gradle", root/"build.gradle.kts"] if p.exists()), None)
          app_gradle = next((p for p in [root/"app"/"build.gradle", root/"app"/"build.gradle.kts"] if p.exists()), None)
          if not root_gradle or not app_gradle:
              raise SystemExit("Could not find Android Gradle build files.")
          root_text = root_gradle.read_text()
          root_plugin = ('    id("com.google.gms.google-services") version "4.6.0" apply false'
                         if root_gradle.suffix == ".kts" else
                         "    id 'com.google.gms.google-services' version '4.6.0' apply false")
          if "com.google.gms.google-services" not in root_text:
              if "plugins {" in root_text:
                  root_text = root_text.replace("plugins {", "plugins {\n" + root_plugin, 1)
              else:
                  root_text = "plugins {\n" + root_plugin + "\n}\n\n" + root_text
              root_gradle.write_text(root_text)
          app_text = app_gradle.read_text()
          if app_gradle.suffix == ".kts":
              app_plugin = '    id("com.google.gms.google-services")'
              firebase_deps = ('    implementation(platform("com.google.firebase:firebase-bom:35.2.0"))\n'
                               '    implementation("com.google.firebase:firebase-analytics")')
          else:
              app_plugin = "    id 'com.google.gms.google-services'"
              firebase_deps = ("    implementation platform('com.google.firebase:firebase-bom:35.2.0')\n"
                               "    implementation 'com.google.firebase:firebase-analytics'")
          if "com.google.gms.google-services" not in app_text:
              if "plugins {" in app_text:
                  app_text = app_text.replace("plugins {", "plugins {\n" + app_plugin, 1)
              else:
                  app_text += "\napply plugin: 'com.google.gms.google-services'\n"
          if "firebase-bom" not in app_text:
              if "dependencies {" in app_text:
                  app_text = app_text.replace("dependencies {", "dependencies {\n" + firebase_deps, 1)
              else:
                  app_text += "\ndependencies {\n" + firebase_deps + "\n}\n"
          app_gradle.write_text(app_text)
          PY

      - name: Synchronize Application
        run: npx cap sync android

      - name: Build Debug APK
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v6
        with:
          name: EduGM-UniTools-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
