
name: Deploy EduGM UniTools Website

on:
  push:
    branches:
      - main
    paths:
      - 'www/**'
      - '.github/workflows/pages.yml'

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy EduGM Website
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Verify Website Files
        run: |
          test -f www/index.html
          test -f www/tools.html
          test -f www/css/style.css
          test -f www/js/app.js

      - name: Upload Website
        uses: actions/upload-pages-artifact@v3
        with:
          path: www

      - name: Deploy Website
        id: deployment
        uses: actions/deploy-pages@v4
